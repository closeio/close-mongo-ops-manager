repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        files: \.rs$
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        files: ^(Cargo\.(toml|lock)|.*\.rs)$
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked
        files: ^(Cargo\.(toml|lock)|.*\.rs)$
        language: system
        pass_filenames: false

